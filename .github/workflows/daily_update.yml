name: Daily Kids English News Generator

on:
  schedule:
    # 每天 UTC 22:00 自動執行 ＝ 台灣時間隔天早上 06:00
    - cron: '0 22 * * *'
  workflow_dispatch: # 保留手動按鈕，隨時想更新都可以按

permissions:
  contents: write

jobs:
  build-daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U google-genai edge-tts

      - name: Generate today's news and audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_daily.py

      - name: Commit and push updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add data/
          git diff --staged --quiet || git commit -m "Auto-update daily news $(date -u +'%Y-%m-%d')"
          git push
