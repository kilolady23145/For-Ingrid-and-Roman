name: Daily Kids English News Generator

on:
  schedule:
    # UTC 時間 22:00 = 台灣時間隔天早上 06:00
    - cron: '0 22 * * *'
  workflow_dispatch: # 允許手動按按鈕立刻測試！

permissions:
  contents: write

jobs:
  build-daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Generate Today's English News & Quiz
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_daily.py

      - name: Save and Publish to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "🌟 Auto-update daily English news"
          git push
