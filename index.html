<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🌟 每日英文伴讀小報 | For Ingrid & Roman</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --accent: #f59e0b;
      --accent-bg: #fef3c7;
      --text: #1e293b;
      --muted: #64748b;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      padding-bottom: 80px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* 頂部橫幅 */
    .hero {
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      color: #fff;
      border-radius: 20px;
      padding: 22px 24px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.18);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      opacity: 0.95;
      margin-bottom: 8px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .hero h1 {
      margin: 6px 0 4px;
      font-size: 25px;
      line-height: 1.35;
    }

    .hero .subtitle-zh {
      margin: 0;
      font-size: 16px;
      opacity: 0.92;
      font-weight: 500;
    }

    /* 語音與翻譯控制列 */
    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-outline {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-outline.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: #93c5fd;
    }

    .voice-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    @media (max-width: 640px) {
      .voice-group {
        width: 100%;
        margin-left: 0;
        padding-top: 6px;
        border-top: 1px dashed var(--border);
      }
    }

    .voice-select {
      flex: 1;
      min-width: 190px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      outline: none;
    }

    /* 提示小字條 */
    .tip-bar {
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      color: #1e40af;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 18px;
    }

    /* 文章卡片 */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 22px 22px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      margin-bottom: 20px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 19px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #0f172a;
    }

    .paragraph-block {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px dashed #e2e8f0;
    }

    .paragraph-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .en-text {
      font-size: 19.5px;
      line-height: 1.9;
      color: #0f172a;
      margin: 0 0 8px;
    }

    .para-speak-btn {
      background: #eff6ff;
      color: var(--primary);
      border: none;
      border-radius: 8px;
      padding: 3px 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 6px;
      vertical-align: middle;
    }

    .word-token {
      cursor: pointer;
      border-radius: 5px;
      padding: 1px 2px;
      transition: background 0.12s;
    }

    .word-token:hover, .word-token:active {
      background: #dbeafe;
    }

    .word-highlight {
      background: var(--accent-bg);
      border-bottom: 2px solid var(--accent);
      font-weight: 600;
      padding: 1px 4px;
    }

    .zh-text {
      margin: 8px 0 0;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 10px;
      color: #475569;
      font-size: 15.5px;
      display: none;
    }

    .zh-text.show { display: block; }

    /* 重點單字牆 */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }

    .vocab-chip {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.12s;
    }

    .vocab-chip:active { transform: scale(0.98); }

    .vocab-chip strong {
      display: block;
      font-size: 16px;
      color: #92400e;
    }

    .vocab-chip span {
      font-size: 13.5px;
      color: #78350f;
    }

    /* 測驗區 */
    .quiz-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .quiz-q {
      font-weight: 700;
      font-size: 17px;
      margin: 0 0 12px;
      color: #0f172a;
    }

    .quiz-options {
      display: grid;
      gap: 8px;
    }

    .opt-btn {
      text-align: left;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      font-size: 15.5px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s;
    }

    .opt-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #14532d;
      font-weight: 700;
    }

    .opt-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #7f1d1d;
    }

    .quiz-exp {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1e3a8a;
      font-size: 14.5px;
      display: none;
    }

    .score-banner {
      text-align: center;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #dcfce7, #dbeafe);
      font-weight: 700;
      font-size: 18px;
      color: #0f172a;
      display: none;
      margin-top: 12px;
    }

    /* 底部彈出點讀字典卡 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 999;
      padding: 12px;
    }

    .modal-backdrop.open { display: flex; }

    .dict-card {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 22px;
      padding: 20px 22px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      animation: slideUp 0.18s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .dict-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .dict-word {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      margin: 0;
    }

    .dict-sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 2px;
    }

    .close-btn {
      background: #f1f5f9;
      border: none;
      border-radius: 999px;
      width: 34px;
      height: 34px;
      font-size: 18px;
      cursor: pointer;
    }

    .dict-zh {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin: 12px 0 6px;
    }

    .dict-exp {
      font-size: 15px;
      color: #334155;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .dict-example {
      font-size: 14.5px;
      color: #475569;
      font-style: italic;
      margin-bottom: 14px;
    }

    .dict-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頂部新聞標題區 -->
    <div class="hero">
      <div class="hero-top">
        <span class="badge" id="newsCategory">🌟 Daily Kids News</span>
        <span id="newsMeta">載入中...</span>
      </div>
      <h1 id="newsTitle">Loading today's story...</h1>
      <p class="subtitle-zh" id="newsTitleZh">正在為 Ingrid & Roman 準備今天的新聞小報...</p>
    </div>

    <!-- 朗讀與聲音選擇工具列 -->
    <div class="toolbar">
      <button class="btn btn-primary" id="playAllBtn" onclick="togglePlayArticle()">🔊 聽整篇新聞</button>
      <button class="btn btn-outline" id="speedBtn" onclick="toggleSpeed()">🐢 語速：0.9x 適中</button>
      <button class="btn btn-outline" id="zhToggleBtn" onclick="toggleAllZh()">👀 顯示中文翻譯</button>

      <div class="voice-group">
        <select id="voiceSelect" class="voice-select" onchange="onVoiceChange()">
          <option value="">🎙️ 自動美式發音 (預設)</option>
        </select>
        <button class="btn btn-outline" onclick="testSelectedVoice()" title="試聽目前選擇的聲音">🔔 試聽</button>
      </div>
    </div>

    <div class="tip-bar">
      💡 <strong>伴讀小撇步：</strong>文章裡<strong>黃色底線</strong>是今日重點單字，但<strong>整篇文章「任何一個英文字」都可以直接點一下</strong>聽發音＋看中文意思喔！
    </div>

    <!-- 新聞內文區 -->
    <div class="card">
      <h2 class="section-title">📖 今日新聞閱讀</h2>
      <div id="articleBody"></div>
    </div>

    <!-- 今日重點單字快速複習牆 -->
    <div class="card">
      <h2 class="section-title">🔑 今日重點單字卡（點一下聽發音）</h2>
      <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <!-- 4 題閱讀理解小測驗 -->
    <div class="card">
      <h2 class="section-title">🎯 閱讀理解小挑戰</h2>
      <div id="quizContainer"></div>
      <div class="score-banner" id="scoreBanner"></div>
    </div>
  </div>

  <!-- 點擊單字彈出的發音字典卡 -->
  <div class="modal-backdrop" id="dictModal" onclick="closeModalOnBg(event)">
    <div class="dict-card">
      <div class="dict-header">
        <div>
          <h3 class="dict-word" id="modalWord">word</h3>
          <div class="dict-sub" id="modalSub"></div>
        </div>
        <button class="close-btn" onclick="closeDictModal()">✕</button>
      </div>
      <div class="dict-zh" id="modalZh">查詢中...</div>
      <div class="dict-exp" id="modalExp"></div>
      <div class="dict-example" id="modalExample"></div>
      <div class="dict-actions">
        <button class="btn btn-primary" onclick="speakModalWord(false)">🔊 正常發音</button>
        <button class="btn btn-outline" onclick="speakModalWord(true)">🐢 慢速跟讀</button>
      </div>
    </div>
  </div>

  <script>
    let articleData = null;
    let speechRate = 0.9;
    let showZh = false;
    let isPlayingAll = false;
    let availableVoices = [];
    let currentModalWord = "";
    let currentModalAudioUrl = "";
    let answeredCount = 0;
    let correctCount = 0;

    // 1. 載入裝置上所有英文語音並填入選單
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const all = window.speechSynthesis.getVoices();
      const enVoices = all.filter(v => /^en(-|_)/i.test(v.lang));
      if (enVoices.length === 0) return;

      // 排序：美式優先，其次英式，再依名稱排
      enVoices.sort((a, b) => {
        const aUS = /US/i.test(a.lang) ? 0 : (/GB/i.test(a.lang) ? 1 : 2);
        const bUS = /US/i.test(b.lang) ? 0 : (/GB/i.test(b.lang) ? 1 : 2);
        if (aUS !== bUS) return aUS - bUS;
        return a.name.localeCompare(b.name);
      });

      availableVoices = enVoices;
      const select = document.getElementById('voiceSelect');
      const savedURI = localStorage.getItem('preferredVoiceURI') || '';

      select.innerHTML = '<option value="">🎙️ 自動挑選美式發音</option>';
      enVoices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        let flag = '🌐';
        if (/US/i.test(v.lang)) flag = '🇺🇸 美式';
        else if (/GB/i.test(v.lang)) flag = '🇬🇧 英式';
        else if (/AU/i.test(v.lang)) flag = '🇦🇺 澳式';
        opt.textContent = `${flag}｜${v.name}`;
        if (v.voiceURI === savedURI) opt.selected = true;
        select.appendChild(opt);
      });
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 200);
      setTimeout(loadVoices, 1000);
    }

    function onVoiceChange() {
      const val = document.getElementById('voiceSelect').value;
      localStorage.setItem('preferredVoiceURI', val);
      testSelectedVoice();
    }

    function getSelectedVoice() {
      if (availableVoices.length === 0) loadVoices();
      const savedURI = localStorage.getItem('preferredVoiceURI');
      if (savedURI) {
        const exact = availableVoices.find(v => v.voiceURI === savedURI);
        if (exact) return exact;
      }
      // 預設優先找自然的美式語音
      return (
        availableVoices.find(v => /US/i.test(v.lang) && /Ava|Evan|Nathan|Allison|Samantha|Alex/i.test(v.name)) ||
        availableVoices.find(v => /US/i.test(v.lang)) ||
        availableVoices[0] ||
        null
      );
    }

    function speakText(text, customRate = null, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        alert('此瀏覽器不支援內建語音朗讀功能');
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const voice = getSelectedVoice();
      if (voice) {
        utter.voice = voice;
        utter.lang = voice.lang;
      } else {
        utter.lang = 'en-US';
      }
      utter.rate = customRate !== null ? customRate : speechRate;

      utter.onend = () => {
        if (onEndCallback) onEndCallback();
      };
      utter.onerror = () => {
        if (onEndCallback) onEndCallback();
      };

      window.speechSynthesis.speak(utter);
    }

    function testSelectedVoice() {
      isPlayingAll = false;
      updatePlayBtn();
      speakText("Hi Ingrid and Roman! Let's read today's news together!");
    }

    function togglePlayArticle() {
      if (!articleData) return;
      if (isPlayingAll) {
        window.speechSynthesis.cancel();
        isPlayingAll = false;
        updatePlayBtn();
        return;
      }
      const fullText = [
        articleData.title,
        ...articleData.paragraphs.map(p => p.en)
      ].join(' ');

      isPlayingAll = true;
      updatePlayBtn();
      speakText(fullText, speechRate, () => {
        isPlayingAll = false;
        updatePlayBtn();
      });
    }

    function updatePlayBtn() {
      const btn = document.getElementById('playAllBtn');
      btn.textContent = isPlayingAll ? '⏹️ 停止朗讀' : '🔊 聽整篇新聞';
    }

    function toggleSpeed() {
      const speeds = [
        { val: 0.75, label: '🐢 語速：0.75x 慢速' },
        { val: 0.9,  label: '🐢 語速：0.9x 適中' },
        { val: 1.0,  label: '🐇 語速：1.0x 正常' }
      ];
      const idx = speeds.findIndex(s => Math.abs(s.val - speechRate) < 0.03);
      const next = speeds[(idx + 1) % speeds.length];
      speechRate = next.val;
      document.getElementById('speedBtn').textContent = next.label;
    }

    function toggleAllZh() {
      showZh = !showZh;
      document.querySelectorAll('.zh-text').forEach(el => {
        el.classList.toggle('show', showZh);
      });
      const btn = document.getElementById('zhToggleBtn');
      btn.classList.toggle('active', showZh);
      btn.textContent = showZh ? '🙈 隱藏中文翻譯' : '👀 顯示中文翻譯';
    }

    // 2. 讀取今日新聞 JSON（加上時間戳記避免快取舊文章）
    async function loadTodayNews() {
      try {
        const res = await fetch(`data/today.json?t=${Date.now()}`);
        articleData = await res.json();
        renderArticle();
      } catch (err) {
        document.getElementById('newsTitle').textContent = '尚無今日新聞資料';
        document.getElementById('newsTitleZh').textContent = '請確認 data/today.json 是否存在。';
      }
    }

    function cleanWord(raw) {
      return raw.toLowerCase().replace(/^[^a-z]+|[^a-z]+$/gi, '');
    }

    function renderArticle() {
      document.getElementById('newsCategory').textContent = articleData.category || '🌟 Daily News';
      document.getElementById('newsMeta').textContent = `📅 ${articleData.date} ｜ ${articleData.level || 'A2'}`;
      document.getElementById('newsTitle').textContent = articleData.title;
      document.getElementById('newsTitleZh').textContent = articleData.title_zh || '';

      const vocabMap = articleData.vocabulary || {};
      const bodyEl = document.getElementById('articleBody');
      bodyEl.innerHTML = '';

      articleData.paragraphs.forEach((para, idx) => {
        const block = document.createElement('div');
        block.className = 'paragraph-block';

        const enP = document.createElement('p');
        enP.className = 'en-text';

        // 單段朗讀小按鈕
        const pBtn = document.createElement('button');
        pBtn.className = 'para-speak-btn';
        pBtn.textContent = `🔊 第 ${idx + 1} 段`;
        pBtn.onclick = () => {
          isPlayingAll = false;
          updatePlayBtn();
          speakText(para.en);
        };
        enP.appendChild(pBtn);

        // 把每個英文字變成可點擊點讀的 Token
        const tokens = para.en.split(/(\s+)/);
        tokens.forEach(tok => {
          if (/^\s+$/.test(tok)) {
            enP.appendChild(document.createTextNode(tok));
            return;
          }
          const cleaned = cleanWord(tok);
          if (!cleaned) {
            enP.appendChild(document.createTextNode(tok));
            return;
          }
          const span = document.createElement('span');
          span.className = 'word-token' + (vocabMap[cleaned] ? ' word-highlight' : '');
          span.textContent = tok;
          span.onclick = () => openWordLookup(cleaned, tok);
          enP.appendChild(span);
        });

        const zhP = document.createElement('p');
        zhP.className = 'zh-text' + (showZh ? ' show' : '');
        zhP.textContent = para.zh;

        block.appendChild(enP);
        block.appendChild(zhP);
        bodyEl.appendChild(block);
      });

      // 渲染重點單字牆
      const grid = document.getElementById('vocabGrid');
      grid.innerHTML = '';
      Object.entries(vocabMap).forEach(([key, info]) => {
        const chip = document.createElement('div');
        chip.className = 'vocab-chip';
        chip.innerHTML = `<strong>🔊 ${info.word || key}</strong><span>${info.zh || ''}</span>`;
        chip.onclick = () => openWordLookup(key, info.word || key);
        grid.appendChild(chip);
      });

      // 渲染 4 題閱讀測驗
      renderQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      container.innerHTML = '';
      answeredCount = 0;
      correctCount = 0;
      document.getElementById('scoreBanner').style.display = 'none';

      const quizList = articleData.quiz || [];
      quizList.forEach((qItem, qIdx) => {
        const box = document.createElement('div');
        box.className = 'quiz-item';

        const qTitle = document.createElement('p');
        qTitle.className = 'quiz-q';
        qTitle.textContent = qItem.question;
        box.appendChild(qTitle);

        const optsDiv = document.createElement('div');
        optsDiv.className = 'quiz-options';

        const expDiv = document.createElement('div');
        expDiv.className = 'quiz-exp';

        qItem.options.forEach((optText, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.textContent = optText;
          btn.onclick = () => {
            if (optsDiv.dataset.locked === '1') return;
            optsDiv.dataset.locked = '1';
            answeredCount++;

            const allBtns = optsDiv.querySelectorAll('.opt-btn');
            if (optIdx === qItem.answer) {
              btn.classList.add('correct');
              correctCount++;
              expDiv.innerHTML = `✅ <strong>太棒了答對囉！</strong> ${qItem.explanation || ''}`;
            } else {
              btn.classList.add('wrong');
              if (allBtns[qItem.answer]) allBtns[qItem.answer].classList.add('correct');
              expDiv.innerHTML = `💡 <strong>沒關係，我們一起看看：</strong> ${qItem.explanation || ''}`;
            }
            expDiv.style.display = 'block';

            if (answeredCount === quizList.length) {
              const banner = document.getElementById('scoreBanner');
              banner.style.display = 'block';
              banner.textContent = `🎉 今日挑戰完成！得分：${correctCount} / ${quizList.length} 題！繼續保持喔！`;
            }
          };
          optsDiv.appendChild(btn);
        });

        box.appendChild(optsDiv);
        box.appendChild(expDiv);
        container.appendChild(box);
      });
    }

    // 3. 點擊任意單字：開啟點讀卡 + 自動發音 + 查詢字典與真人音檔備援
    async function openWordLookup(cleanedKey, rawDisplay) {
      currentModalWord = cleanedKey;
      currentModalAudioUrl = "";

      const modal = document.getElementById('dictModal');
      const vocabMap = (articleData && articleData.vocabulary) || {};
      const localInfo = vocabMap[cleanedKey];

      modal.classList.add('open');
      isPlayingAll = false;
      updatePlayBtn();

      // 先立刻用裝置語音唸出來，零延遲！
      speakText(localInfo ? (localInfo.word || cleanedKey) : cleanedKey, 0.88);

      if (localInfo) {
        document.getElementById('modalWord').textContent = localInfo.word || cleanedKey;
        document.getElementById('modalSub').textContent =
          [localInfo.syllables, localInfo.pos].filter(Boolean).join(' ｜ ');
        document.getElementById('modalZh').textContent = localInfo.zh || '';
        document.getElementById('modalExp').textContent = `💬 ${localInfo.explanation || ''}`;
        document.getElementById('modalExample').textContent = localInfo.example ? `例句：${localInfo.example}` : '';
        // 背景偷偷抓真人 MP3 備援，之後按「正常發音」可聽真人字典原音
        fetchDictionaryAudioOnly(localInfo.word || cleanedKey);
      } else {
        // 非重點黃底字：即時串接免費英文字典 + 繁中翻譯
        document.getElementById('modalWord').textContent = cleanedKey;
        document.getElementById('modalSub').textContent = '即時字典查詢中...';
        document.getElementById('modalZh').textContent = '⏳ 正在查繁體中文意思...';
        document.getElementById('modalExp').textContent = '正在載入英文解釋...';
        document.getElementById('modalExample').textContent = '';

        fetchLiveWordInfo(cleanedKey);
      }
    }

    async function fetchDictionaryAudioOnly(word) {
      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (!res.ok) return;
        const json = await res.json();
        const phonetics = (json[0] && json[0].phonetics) || [];
        const usAudio = phonetics.find(p => p.audio && p.audio.includes('-us')) || phonetics.find(p => p.audio);
        if (usAudio && usAudio.audio) currentModalAudioUrl = usAudio.audio;
      } catch (_) {}
    }

    async function fetchLiveWordInfo(word) {
      // 同步查詢中文翻譯 + 英文字典音標與例句
      const zhPromise = fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-TW`)
        .then(r => r.json())
        .catch(() => null);

      const dictPromise = fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);

      const [zhData, dictData] = await Promise.all([zhPromise, dictPromise]);

      if (currentModalWord !== word) return;

      const zhText = zhData && zhData.responseData && zhData.responseData.translatedText;
      document.getElementById('modalZh').textContent = zhText || '（請參考下方英文解釋）';

      if (dictData && dictData[0]) {
        const entry = dictData[0];
        const phonetic = entry.phonetic || ((entry.phonetics || []).find(p => p.text)?.text) || '';
        const phonetics = entry.phonetics || [];
        const usAudio = phonetics.find(p => p.audio && p.audio.includes('-us')) || phonetics.find(p => p.audio);
        if (usAudio && usAudio.audio) currentModalAudioUrl = usAudio.audio;

        const firstMeaning = (entry.meanings && entry.meanings[0]) || {};
        const pos = firstMeaning.partOfSpeech || '';
        const defObj = (firstMeaning.definitions && firstMeaning.definitions[0]) || {};

        document.getElementById('modalSub').textContent = [phonetic, pos].filter(Boolean).join(' ｜ ');
        document.getElementById('modalExp').textContent = defObj.definition
          ? `📘 英文解釋：${defObj.definition}`
          : '已找到單字發音，點擊下方按鈕可重複聽取！';
        document.getElementById('modalExample').textContent = defObj.example ? `例句：${defObj.example}` : '';
      } else {
        document.getElementById('modalSub').textContent = '單字點讀';
        document.getElementById('modalExp').textContent = '可點擊下方按鈕重複聽正常或慢速發音喔！';
      }
    }

    function speakModalWord(slow = false) {
      if (!currentModalWord) return;
      // 若按「正常發音」且剛好有真人字典 MP3，優先播真人錄音；慢速則用合成語音放慢
      if (!slow && currentModalAudioUrl) {
        const audio = new Audio(currentModalAudioUrl);
        audio.play().catch(() => speakText(currentModalWord, 0.9));
      } else {
        speakText(currentModalWord, slow ? 0.6 : 0.9);
      }
    }

    function closeDictModal() {
      document.getElementById('dictModal').classList.remove('open');
    }

    function closeModalOnBg(e) {
      if (e.target.id === 'dictModal') closeDictModal();
    }

    loadTodayNews();
  </script>
