<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🌟 每日英文伴讀小報 | For Ingrid & Roman</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --accent: #f59e0b;
      --accent-bg: #fef3c7;
      --text: #1e293b;
      --muted: #64748b;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 0 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .hero {
      background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%);
      color: #fff;
      border-radius: 22px;
      padding: 22px 24px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.18);
      margin-bottom: 16px;
    }

    .hero-top {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      opacity: 0.95;
      margin-bottom: 10px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.22);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
    }

    .hero h1 {
      margin: 4px 0 6px;
      font-size: 25px;
      line-height: 1.35;
    }

    .hero .subtitle-zh {
      margin: 0;
      font-size: 16.5px;
      opacity: 0.94;
      font-weight: 500;
    }

    .photo-card {
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      margin-bottom: 16px;
      display: none;
    }

    .photo-card img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      display: block;
    }

    .photo-caption {
      padding: 10px 16px;
      font-size: 13.5px;
      color: var(--muted);
      background: #f8fafc;
      border-top: 1px solid var(--border);
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-outline.active { background: var(--primary-light); color: var(--primary); border-color: #93c5fd; }

    .voice-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .voice-label {
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }

    .voice-select {
      flex: 1;
      min-width: 190px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1.5px solid #94a3b8;
      background: #fff;
      color: var(--text);
      font-size: 14.5px;
      font-weight: 600;
    }

    .tip-bar {
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      color: #1e40af;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      margin-bottom: 20px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 19px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #0f172a;
    }

    .paragraph-block {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px dashed #e2e8f0;
    }

    .paragraph-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .en-text {
      font-size: 19px;
      line-height: 1.9;
      color: #0f172a;
      margin: 0 0 8px;
    }

    .para-speak-btn {
      background: #eff6ff;
      color: var(--primary);
      border: none;
      border-radius: 8px;
      padding: 3px 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 6px;
      vertical-align: middle;
    }

    .word-token {
      cursor: pointer;
      border-radius: 5px;
      padding: 1px 2px;
      transition: background 0.12s;
    }

    .word-token:hover, .word-token:active { background: #dbeafe; }

    .word-highlight {
      background: var(--accent-bg);
      border-bottom: 2px solid var(--accent);
      font-weight: 600;
      padding: 1px 4px;
    }

    .zh-text {
      margin: 8px 0 0;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 10px;
      color: #475569;
      font-size: 15.5px;
      display: none;
    }

    .zh-text.show { display: block; }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
    }

    .vocab-chip {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .vocab-chip strong { display: block; font-size: 16px; color: #92400e; }
    .vocab-chip span { font-size: 13.5px; color: #78350f; }

    .quiz-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .quiz-q { font-weight: 700; font-size: 17px; margin: 0 0 12px; color: #0f172a; }
    .quiz-options { display: grid; gap: 8px; }

    .opt-btn {
      text-align: left;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      font-size: 15.5px;
      color: var(--text);
      cursor: pointer;
    }

    .opt-btn.correct { background: var(--success-bg); border-color: var(--success); color: #14532d; font-weight: 700; }
    .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: #7f1d1d; }

    .quiz-exp {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1e3a8a;
      font-size: 14.5px;
      display: none;
    }

    .score-banner {
      text-align: center;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #dcfce7, #dbeafe);
      font-weight: 700;
      font-size: 18px;
      color: #0f172a;
      display: none;
      margin-top: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 999;
      padding: 12px;
    }

    .modal-backdrop.open { display: flex; }

    .dict-card {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 22px;
      padding: 20px 22px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .dict-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .dict-word { font-size: 26px; font-weight: 800; color: var(--primary); margin: 0; }
    .dict-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
    .close-btn { background: #f1f5f9; border: none; border-radius: 999px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }
    .dict-zh { font-size: 20px; font-weight: 700; color: #0f172a; margin: 12px 0 6px; }
    .dict-exp { font-size: 15px; color: #334155; background: #f8fafc; padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; }
    .dict-example { font-size: 14.5px; color: #475569; font-style: italic; margin-bottom: 14px; }
    .dict-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <!-- 專為 iPhone Safari 設計的單一持久音訊播放器，支援連續換段播放與調速 -->
  <audio id="cloudPlayer" preload="auto"></audio>

  <div class="container">
    <div class="hero">
      <div class="hero-top">
        <span class="badge" id="newsCategory">🌟 Daily News</span>
        <span id="newsMeta">載入中...</span>
      </div>
      <h1 id="newsTitle">Loading today's story...</h1>
      <p class="subtitle-zh" id="newsTitleZh">正在載入今日新聞與題目...</p>
    </div>

    <div class="photo-card" id="photoCard">
      <img id="newsImage" alt="Today's News Visual" onerror="handleImgError(this)" />
      <div class="photo-caption" id="newsCaption"></div>
    </div>

    <div class="toolbar">
      <button class="btn btn-primary" id="playAllBtn" onclick="togglePlayArticle()">🔊 聽整篇新聞</button>
      <button class="btn btn-outline" id="speedBtn" onclick="toggleSpeed()">🐢 語速：0.9x 適中</button>
      <button class="btn btn-outline" id="zhToggleBtn" onclick="toggleAllZh()">👀 顯示中文翻譯</button>

      <div class="voice-group">
        <span class="voice-label">🎙️ 朗讀老師：</span>
        <select id="voiceSelect" class="voice-select" onchange="onVoiceChange()">
          <option value="cloud_uk_male">🇬🇧 載入語音清單中...</option>
        </select>
        <button class="btn btn-outline" onclick="testSelectedVoice()">🔔 試聽聲音</button>
      </div>
    </div>

    <div class="tip-bar">
      💡 <strong>點讀魔法：</strong><strong>黃底字</strong>為今日重點學術字彙，而且<strong>整篇文章「每一個英文字」都可以直接點一下</strong>聽發音、看中文翻譯！
    </div>

    <div class="card">
      <h2 class="section-title">📖 今日深度新聞閱讀</h2>
      <div id="articleBody"></div>
    </div>

    <div class="card">
      <h2 class="section-title">🔑 核心學術單字卡（點擊聽發音）</h2>
      <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <div class="card">
      <h2 class="section-title">🎯 閱讀理解素養挑戰</h2>
      <div id="quizContainer"></div>
      <div class="score-banner" id="scoreBanner"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="dictModal" onclick="closeModalOnBg(event)">
    <div class="dict-card">
      <div class="dict-header">
        <div>
          <h3 class="dict-word" id="modalWord">word</h3>
          <div class="dict-sub" id="modalSub"></div>
        </div>
        <button class="close-btn" onclick="closeDictModal()">✕</button>
      </div>
      <div class="dict-zh" id="modalZh">查詢中...</div>
      <div class="dict-exp" id="modalExp"></div>
      <div class="dict-example" id="modalExample"></div>
      <div class="dict-actions">
        <button class="btn btn-primary" onclick="speakModalWord(false)">🔊 正常發音</button>
        <button class="btn btn-outline" onclick="speakModalWord(true)">🐢 慢速跟讀</button>
      </div>
    </div>
  </div>

  <script>
    let articleData = null;
    let speechRate = 0.9;
    let showZh = false;
    let isPlayingAll = false;
    let availableVoices = [];
    let audioQueue = [];
    let currentModalWord = "";
    let currentModalAudioUrl = "";
    let answeredCount = 0;
    let correctCount = 0;
    const sessionBust = Date.now();

    const BACKUP_PHOTO = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1200&q=80";
    // 過濾掉 iPhone 內建的搞笑機器人特效音
    const JUNK_VOICE_NAMES = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Kathy|Junior|Fred/i;

    const cloudPlayer = document.getElementById('cloudPlayer');
    cloudPlayer.onended = () => {
      if (audioQueue.length > 0) {
        playNextInQueue();
      } else {
        isPlayingAll = false;
        updatePlayBtn();
      }
    };

    function stopAllAudio() {
      audioQueue = [];
      cloudPlayer.pause();
      cloudPlayer.currentTime = 0;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function playCloudQueue(urls, fallbackText = "") {
      stopAllAudio();
      if (!urls || urls.length === 0) {
        if (fallbackText) speakLocalText(fallbackText, speechRate);
        return;
      }
      audioQueue = urls.map(u => `${u}?v=${sessionBust}`);
      playNextInQueue(fallbackText);
    }

    function playNextInQueue(fallbackText = "") {
      if (audioQueue.length === 0) {
        isPlayingAll = false;
        updatePlayBtn();
        return;
      }
      const nextUrl = audioQueue.shift();
      cloudPlayer.src = nextUrl;
      cloudPlayer.playbackRate = speechRate;
      cloudPlayer.play().catch(() => {
        audioQueue = [];
        isPlayingAll = false;
        updatePlayBtn();
        if (fallbackText) speakLocalText(fallbackText, speechRate);
      });
    }

    function handleImgError(imgEl) {
      if (imgEl.dataset.retried) {
        document.getElementById('photoCard').style.display = 'none';
        return;
      }
      imgEl.dataset.retried = "1";
      imgEl.src = BACKUP_PHOTO;
    }

    function rebuildVoiceMenu() {
      const select = document.getElementById('voiceSelect');
      const savedURI = localStorage.getItem('preferredVoiceURI') || 'cloud_uk_male';
      select.innerHTML = '';

      const cloudMap = (articleData && articleData.cloud_audio) || {};
      const cloudKeys = Object.keys(cloudMap);

      // 1. 優先置頂「雲端真人級男女主播」（手機也能聽純正 UK English Male！）
      if (cloudKeys.length > 0) {
        const cloudGroup = document.createElement('optgroup');
        cloudGroup.label = '🌟 雲端真人級主播（手機／電腦通用）';
        cloudKeys.forEach(k => {
          const opt = document.createElement('option');
          opt.value = k;
          opt.textContent = cloudMap[k].label;
          if (k === savedURI) opt.selected = true;
          cloudGroup.appendChild(opt);
        });
        select.appendChild(cloudGroup);
      }

      // 2. 接著列出裝置內建的乾淨語音（過濾怪聲與重複名稱）
      if ('speechSynthesis' in window) {
        const raw = window.speechSynthesis.getVoices();
        const seenNames = new Set();
        const cleanVoices = raw.filter(v => {
          if (!/^en(-|_)/i.test(v.lang)) return false;
          if (JUNK_VOICE_NAMES.test(v.name)) return false;
          const key = `${v.lang}_${v.name}`;
          if (seenNames.has(key)) return false;
          seenNames.add(key);
          return true;
        });

        cleanVoices.sort((a, b) => {
          const aRank = /GB/i.test(a.lang) ? 0 : (/US/i.test(a.lang) ? 1 : 2);
          const bRank = /GB/i.test(b.lang) ? 0 : (/US/i.test(b.lang) ? 1 : 2);
          if (aRank !== bRank) return aRank - bRank;
          return a.name.localeCompare(b.name);
        });

        availableVoices = cleanVoices;

        if (cleanVoices.length > 0) {
          const localGroup = document.createElement('optgroup');
          localGroup.label = '📱 此裝置內建語音';
          cleanVoices.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.voiceURI;
            let flag = '🌐';
            if (/GB/i.test(v.lang)) flag = '🇬🇧 英式';
            else if (/US/i.test(v.lang)) flag = '🇺🇸 美式';
            else if (/AU/i.test(v.lang)) flag = '🇦🇺 澳式';
            opt.textContent = `${flag}｜${v.name}`;
            if (v.voiceURI === savedURI) opt.selected = true;
            localGroup.appendChild(opt);
          });
          select.appendChild(localGroup);
        }
      }

      // 若原先沒選中任何項目，預設選第一個（即 UK English Male 雲端男主播）
      if (!select.value && select.options.length > 0) {
        select.selectedIndex = 0;
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = rebuildVoiceMenu;
      setTimeout(rebuildVoiceMenu, 300);
      setTimeout(rebuildVoiceMenu, 1000);
    }

    function getActiveCloudPack() {
      const val = document.getElementById('voiceSelect').value;
      const cloudMap = (articleData && articleData.cloud_audio) || {};
      return cloudMap[val] || null;
    }

    function onVoiceChange() {
      const val = document.getElementById('voiceSelect').value;
      localStorage.setItem('preferredVoiceURI', val);
      testSelectedVoice();
    }

    function getFallbackLocalVoice() {
      const val = document.getElementById('voiceSelect').value || '';
      const exact = availableVoices.find(v => v.voiceURI === val);
      if (exact) return exact;
      // 若選的是英式雲端語音，單字即時發音優先配對裝置內的英式聲音（如 Daniel / Google UK）
      if (val.includes('_uk_')) {
        return availableVoices.find(v => /GB/i.test(v.lang) && /Male|Daniel|Arthur|Oliver/i.test(v.name))
          || availableVoices.find(v => /GB/i.test(v.lang))
          || availableVoices[0] || null;
      }
      return availableVoices.find(v => /US/i.test(v.lang)) || availableVoices[0] || null;
    }

    function speakLocalText(text, customRate = null, onEndCallback = null) {
      if (!('speechSynthesis' in window)) return;
      stopAllAudio();
      const utter = new SpeechSynthesisUtterance(text);
      const voice = getFallbackLocalVoice();
      if (voice) {
        utter.voice = voice;
        utter.lang = voice.lang;
      } else {
        utter.lang = 'en-GB';
      }
      utter.rate = customRate !== null ? customRate : speechRate;
      utter.onend = () => { if (onEndCallback) onEndCallback(); };
      utter.onerror = () => { if (onEndCallback) onEndCallback(); };
      window.speechSynthesis.speak(utter);
    }

    function testSelectedVoice() {
      isPlayingAll = false;
      updatePlayBtn();
      const cloudPack = getActiveCloudPack();
      if (cloudPack && cloudPack.title) {
        playCloudQueue([cloudPack.title], articleData ? articleData.title : "Hello Ingrid and Roman!");
      } else {
        speakLocalText("Hello Ingrid and Roman! Let's explore today's science story.");
      }
    }

    function playSingleParagraph(idx, enText) {
      isPlayingAll = false;
      updatePlayBtn();
      const cloudPack = getActiveCloudPack();
      if (cloudPack && cloudPack.paragraphs && cloudPack.paragraphs[idx]) {
        playCloudQueue([cloudPack.paragraphs[idx]], enText);
      } else {
        speakLocalText(enText);
      }
    }

    function togglePlayArticle() {
      if (!articleData) return;
      if (isPlayingAll) {
        stopAllAudio();
        isPlayingAll = false;
        updatePlayBtn();
        return;
      }

      const paras = (articleData.paragraphs || []).map(p => typeof p === 'string' ? p : (p.en || ''));
      const fullText = [articleData.title, ...paras].join(' ');
      const cloudPack = getActiveCloudPack();

      isPlayingAll = true;
      updatePlayBtn();

      if (cloudPack && cloudPack.paragraphs && cloudPack.paragraphs.length > 0) {
        const list = cloudPack.title ? [cloudPack.title, ...cloudPack.paragraphs] : [...cloudPack.paragraphs];
        playCloudQueue(list, fullText);
      } else {
        speakLocalText(fullText, speechRate, () => {
          isPlayingAll = false;
          updatePlayBtn();
        });
      }
    }

    function updatePlayBtn() {
      document.getElementById('playAllBtn').textContent = isPlayingAll ? '⏹️ 停止朗讀' : '🔊 聽整篇新聞';
    }

    function toggleSpeed() {
      const speeds = [
        { val: 0.75, label: '🐢 語速：0.75x 慢速' },
        { val: 0.9,  label: '🐢 語速：0.9x 適中' },
        { val: 1.0,  label: '🐇 語速：1.0x 正常' }
      ];
      const idx = speeds.findIndex(s => Math.abs(s.val - speechRate) < 0.03);
      const next = speeds[(idx + 1) % speeds.length];
      speechRate = next.val;
      cloudPlayer.playbackRate = speechRate;
      document.getElementById('speedBtn').textContent = next.label;
    }

    function toggleAllZh() {
      showZh = !showZh;
      document.querySelectorAll('.zh-text').forEach(el => el.classList.toggle('show', showZh));
      const btn = document.getElementById('zhToggleBtn');
      btn.classList.toggle('active', showZh);
      btn.textContent = showZh ? '🙈 隱藏中文翻譯' : '👀 顯示中文翻譯';
    }

    async function loadTodayNews() {
      try {
        const res = await fetch(`data/today.json?t=${Date.now()}`);
        articleData = await res.json();
        rebuildVoiceMenu();
        renderArticle();
      } catch (err) {
        document.getElementById('newsTitle').textContent = '尚無今日新聞資料';
        document.getElementById('newsTitleZh').textContent = '請先到 GitHub Actions 執行一次 Run workflow 喔！';
      }
    }

    function cleanWord(raw) {
      return raw.toLowerCase().replace(/^[^a-z]+|[^a-z]+$/gi, '');
    }

    function normalizeVocab(rawVocab) {
      if (!rawVocab) return {};
      if (Array.isArray(rawVocab)) {
        const map = {};
        rawVocab.forEach(item => {
          const k = cleanWord(item.word || item.term || '');
          if (k) map[k] = item;
        });
        return map;
      }
      return rawVocab;
    }

    function renderArticle() {
      document.getElementById('newsCategory').textContent = articleData.category || '🌟 Daily News';
      document.getElementById('newsMeta').textContent = `📅 ${articleData.date || ''} ｜ ${articleData.level || 'US Grade 7–8'}`;
      document.getElementById('newsTitle').textContent = articleData.title || '';
      document.getElementById('newsTitleZh').textContent = articleData.title_zh || '';

      const imgUrl = articleData.image_url || BACKUP_PHOTO;
      const photoCard = document.getElementById('photoCard');
      const imgEl = document.getElementById('newsImage');
      imgEl.src = imgUrl;
      document.getElementById('newsCaption').textContent = articleData.image_caption || `📸 今日新聞主題視覺｜${articleData.title_zh || articleData.title}`;
      photoCard.style.display = 'block';

      const vocabMap = normalizeVocab(articleData.vocabulary);
      articleData._vocabMap = vocabMap;

      const bodyEl = document.getElementById('articleBody');
      bodyEl.innerHTML = '';

      (articleData.paragraphs || []).forEach((paraObj, idx) => {
        const enStr = typeof paraObj === 'string' ? paraObj : (paraObj.en || '');
        const zhStr = typeof paraObj === 'string' ? '' : (paraObj.zh || '');

        const block = document.createElement('div');
        block.className = 'paragraph-block';

        const enP = document.createElement('p');
        enP.className = 'en-text';

        const pBtn = document.createElement('button');
        pBtn.className = 'para-speak-btn';
        pBtn.textContent = `🔊 第 ${idx + 1} 段`;
        pBtn.onclick = () => playSingleParagraph(idx, enStr);
        enP.appendChild(pBtn);

        enStr.split(/(\s+)/).forEach(tok => {
          if (/^\s+$/.test(tok)) {
            enP.appendChild(document.createTextNode(tok));
            return;
          }
          const cleaned = cleanWord(tok);
          if (!cleaned) {
            enP.appendChild(document.createTextNode(tok));
            return;
          }
          const span = document.createElement('span');
          span.className = 'word-token' + (vocabMap[cleaned] ? ' word-highlight' : '');
          span.textContent = tok;
          span.onclick = () => openWordLookup(cleaned);
          enP.appendChild(span);
        });

        block.appendChild(enP);
        if (zhStr) {
          const zhP = document.createElement('p');
          zhP.className = 'zh-text' + (showZh ? ' show' : '');
          zhP.textContent = zhStr;
          block.appendChild(zhP);
        }
        bodyEl.appendChild(block);
      });

      const grid = document.getElementById('vocabGrid');
      grid.innerHTML = '';
      Object.entries(vocabMap).forEach(([key, info]) => {
        const chip = document.createElement('div');
        chip.className = 'vocab-chip';
        chip.innerHTML = `<strong>🔊 ${info.word || key}</strong><span>${info.zh || ''}</span>`;
        chip.onclick = () => openWordLookup(key);
        grid.appendChild(chip);
      });

      renderQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      container.innerHTML = '';
      answeredCount = 0;
      correctCount = 0;
      document.getElementById('scoreBanner').style.display = 'none';

      const quizList = articleData.quiz || [];
      quizList.forEach(qItem => {
        const box = document.createElement('div');
        box.className = 'quiz-item';

        const qTitle = document.createElement('p');
        qTitle.className = 'quiz-q';
        qTitle.textContent = qItem.question;
        box.appendChild(qTitle);

        const optsDiv = document.createElement('div');
        optsDiv.className = 'quiz-options';
        const expDiv = document.createElement('div');
        expDiv.className = 'quiz-exp';

        const ansIdx = typeof qItem.answer === 'number' ? qItem.answer : 0;

        (qItem.options || []).forEach((optText, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.textContent = optText;
          btn.onclick = () => {
            if (optsDiv.dataset.locked === '1') return;
            optsDiv.dataset.locked = '1';
            answeredCount++;

            const allBtns = optsDiv.querySelectorAll('.opt-btn');
            if (optIdx === ansIdx) {
              btn.classList.add('correct');
              correctCount++;
              expDiv.innerHTML = `✅ <strong>太棒了答對囉！</strong> ${qItem.explanation || ''}`;
            } else {
              btn.classList.add('wrong');
              if (allBtns[ansIdx]) allBtns[ansIdx].classList.add('correct');
              expDiv.innerHTML = `💡 <strong>解析：</strong> ${qItem.explanation || ''}`;
            }
            expDiv.style.display = 'block';

            if (answeredCount === quizList.length) {
              const banner = document.getElementById('scoreBanner');
              banner.style.display = 'block';
              banner.textContent = `🎉 今日挑戰完成！得分：${correctCount} / ${quizList.length} 題！`;
            }
          };
          optsDiv.appendChild(btn);
        });

        box.appendChild(optsDiv);
        box.appendChild(expDiv);
        container.appendChild(box);
      });
    }

    async function openWordLookup(cleanedKey) {
      currentModalWord = cleanedKey;
      currentModalAudioUrl = "";

      const modal = document.getElementById('dictModal');
      const vocabMap = (articleData && articleData._vocabMap) || {};
      const localInfo = vocabMap[cleanedKey];

      modal.classList.add('open');
      isPlayingAll = false;
      updatePlayBtn();

      const targetWord = localInfo ? (localInfo.word || cleanedKey) : cleanedKey;
      speakLocalText(targetWord, 0.88);

      if (localInfo) {
        document.getElementById('modalWord').textContent = targetWord;
        document.getElementById('modalSub').textContent = [localInfo.syllables, localInfo.pos].filter(Boolean).join(' ｜ ');
        document.getElementById('modalZh').textContent = localInfo.zh || '';
        document.getElementById('modalExp').textContent = `💬 ${localInfo.explanation || ''}`;
        document.getElementById('modalExample').textContent = localInfo.example ? `例句：${localInfo.example}` : '';
        fetchDictionaryAudioOnly(targetWord);
      } else {
        document.getElementById('modalWord').textContent = cleanedKey;
        document.getElementById('modalSub').textContent = '即時字典查詢中...';
        document.getElementById('modalZh').textContent = '⏳ 正在查詢中文意思...';
        document.getElementById('modalExp').textContent = '正在載入英文解釋...';
        document.getElementById('modalExample').textContent = '';
        fetchLiveWordInfo(cleanedKey);
      }
    }

    async function fetchDictionaryAudioOnly(word) {
      try {
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (!res.ok) return;
        const json = await res.json();
        const phonetics = (json[0] && json[0].phonetics) || [];
        const ukOrUs = phonetics.find(p => p.audio && p.audio.includes('-uk'))
          || phonetics.find(p => p.audio && p.audio.includes('-us'))
          || phonetics.find(p => p.audio);
        if (ukOrUs && ukOrUs.audio) currentModalAudioUrl = ukOrUs.audio;
      } catch (_) {}
    }

    async function fetchLiveWordInfo(word) {
      const zhPromise = fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-TW`).then(r => r.json()).catch(() => null);
      const dictPromise = fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`).then(r => r.ok ? r.json() : null).catch(() => null);
      const [zhData, dictData] = await Promise.all([zhPromise, dictPromise]);
      if (currentModalWord !== word) return;

      const zhText = zhData && zhData.responseData && zhData.responseData.translatedText;
      document.getElementById('modalZh').textContent = zhText || '（請參考下方英文解釋）';

      if (dictData && dictData[0]) {
        const entry = dictData[0];
        const phonetic = entry.phonetic || ((entry.phonetics || []).find(p => p.text)?.text) || '';
        const phonetics = entry.phonetics || [];
        const ukOrUs = phonetics.find(p => p.audio && p.audio.includes('-uk'))
          || phonetics.find(p => p.audio && p.audio.includes('-us'))
          || phonetics.find(p => p.audio);
        if (ukOrUs && ukOrUs.audio) currentModalAudioUrl = ukOrUs.audio;

        const firstMeaning = (entry.meanings && entry.meanings[0]) || {};
        const defObj = (firstMeaning.definitions && firstMeaning.definitions[0]) || {};
        document.getElementById('modalSub').textContent = [phonetic, firstMeaning.partOfSpeech].filter(Boolean).join(' ｜ ');
        document.getElementById('modalExp').textContent = defObj.definition ? `📘 英文解釋：${defObj.definition}` : '點擊下方按鈕可重複聽發音！';
        document.getElementById('modalExample').textContent = defObj.example ? `例句：${defObj.example}` : '';
      } else {
        document.getElementById('modalSub').textContent = '單字點讀';
        document.getElementById('modalExp').textContent = '點擊下方按鈕可重複聽正常或慢速發音！';
      }
    }

    function speakModalWord(slow = false) {
      if (!currentModalWord) return;
      if (!slow && currentModalAudioUrl) {
        const audio = new Audio(currentModalAudioUrl);
        audio.play().catch(() => speakLocalText(currentModalWord, 0.9));
      } else {
        speakLocalText(currentModalWord, slow ? 0.6 : 0.9);
      }
    }

    function closeDictModal() { document.getElementById('dictModal').classList.remove('open'); }
    function closeModalOnBg(e) { if (e.target.id === 'dictModal') closeDictModal(); }

    loadTodayNews();
  </script>
</body>
